{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exportando PDF</title>
    <link rel="stylesheet" href="{% static 'css/page_rdo.css' %}">
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f6f7f9;
            color: #111;
        }
        .mobile-pdf-export-shell {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }
        .mobile-pdf-export-card {
            width: min(100%, 480px);
            background: #fff;
            border: 1px solid #e4e8ed;
            border-radius: 20px;
            box-shadow: 0 18px 40px rgba(17, 17, 17, 0.08);
            padding: 28px 24px;
        }
        .mobile-pdf-export-card h1 {
            margin: 0 0 10px;
            font-size: 1.25rem;
        }
        .mobile-pdf-export-card p {
            margin: 0;
            line-height: 1.55;
            color: #4a5565;
        }
        .mobile-pdf-export-status {
            margin-top: 18px;
            padding: 14px 16px;
            border-radius: 14px;
            background: #f8fbef;
            border: 1px solid #d4ef66;
            color: #24320e;
            font-weight: 600;
        }
        .mobile-pdf-export-error {
            background: #fff2f0;
            border-color: #f1b1a8;
            color: #8b1e11;
        }
        .mobile-pdf-export-help {
            margin-top: 12px;
            font-size: 0.92rem;
        }
        .mobile-pdf-export-actions {
            margin-top: 18px;
            display: none;
            gap: 12px;
            flex-wrap: wrap;
        }
        .mobile-pdf-export-btn {
            appearance: none;
            border: none;
            border-radius: 14px;
            padding: 14px 18px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
        }
        .mobile-pdf-export-btn.primary {
            background: #ccff00;
            color: #111;
        }
        .mobile-pdf-export-btn.secondary {
            background: #111;
            color: #fff;
        }
    </style>
</head>
<body>
    <div class="mobile-pdf-export-shell">
        <div class="mobile-pdf-export-card">
            <h1>Gerando PDF</h1>
            <p>O app está preparando um único arquivo com {{ rdo_count }} RDO(s). Aguarde alguns segundos.</p>
            <div id="pdf-export-status" class="mobile-pdf-export-status">Iniciando exportação...</div>
            <div id="pdf-export-actions" class="mobile-pdf-export-actions">
                <button type="button" id="pdf-export-download-btn" class="mobile-pdf-export-btn primary">
                    Baixar PDF agora
                </button>
                <button type="button" id="pdf-export-retry-btn" class="mobile-pdf-export-btn secondary">
                    Tentar novamente
                </button>
            </div>
            <p class="mobile-pdf-export-help">Se o download não começar automaticamente, volte ao app e tente novamente.</p>
        </div>
    </div>

    <script>
        window.__MOBILE_RDO_PDF_EXPORT__ = {
            pageUrls: {{ page_urls_json|safe }},
            fileName: "{{ file_name|escapejs }}"
        };
    </script>
    <script>
    {% include 'mobile_rdo_pdf_export_script.html' %}
    </script>
</body>
</html>
