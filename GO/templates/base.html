{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Synchro{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <link rel="stylesheet" href="{% static 'css/cadastro.css' %}">
    <link rel="stylesheet" href="{% static 'css/logout.css' %}">
    <link rel="stylesheet" href="{% static 'css/ajuda.css' %}">
    <link rel="stylesheet" href="{% static 'css/synchro_shell.css' %}?v=20260728d">
    <link rel="shortcut icon" href="{% static 'js/img/ico/favicon.ico' %}" type="image/x-icon">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    {% block extra_head %}{% endblock %}
</head>
<body>
    <div class="logout-overlay" id="logoutOverlay">
        <div class="logout-content">
            <div class="logout-icon" aria-hidden="true"><span class="material-icons" aria-hidden="true">logout</span></div>
            <div class="logout-message">Até logo!</div>
            <div class="logout-subtext">Você está sendo desconectado...</div>
        </div>
    </div>
    <div class="site-wrapper" id="site-wrapper" data-can-edit-system="{% if can_edit_system %}true{% else %}false{% endif %}">
        {% include '_synchro_shell.html' %}
        <main>{% block content %}{% endblock %}</main>
    </div>
    <script src="{% static 'js/scripts.js' %}"></script>
    <script src="{% static 'js/synchro_shell.js' %}?v=20260728d"></script>
    {% block extra_scripts %}{% endblock %}
</body>
</html>
