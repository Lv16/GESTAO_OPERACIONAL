{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RDO PDF</title>
    <link rel="stylesheet" href="{% static 'css/page_rdo.css' %}">
    {% if inline_css %}{{ inline_css|safe }}{% endif %}
    <style>
        .pdf-page-break {
            break-before: page;
            page-break-before: always;
        }
    </style>
</head>
<body>
    {% for page_html in page_fragments %}
        {% if not forloop.first %}<div class="pdf-page-break"></div>{% endif %}
        {{ page_html|safe }}
    {% endfor %}
</body>
</html>
